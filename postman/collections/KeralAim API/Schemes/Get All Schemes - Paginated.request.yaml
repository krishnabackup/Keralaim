$kind: http-request
name: 'Get All Schemes - Paginated (Page 2)'
method: GET
url: '{{baseUrl}}/api/schemes'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
queryParams:
  - key: page
    value: '2'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response page equals 2", function () {
          pm.expect(pm.response.json().page).to.equal(2);
      });
