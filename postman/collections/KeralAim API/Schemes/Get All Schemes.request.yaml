$kind: http-request
name: Get All Schemes
method: GET
url: '{{baseUrl}}/api/schemes'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success: true", function () {
          pm.expect(pm.response.json().success).to.be.true;
      });

      pm.test("Response has data (array)", function () {
          pm.expect(pm.response.json().data).to.be.an("array");
      });

      pm.test("Response has total (number)", function () {
          pm.expect(pm.response.json().total).to.be.a("number");
      });

      pm.test("Response has page (number)", function () {
          pm.expect(pm.response.json().page).to.be.a("number");
      });

      pm.test("Response has totalPages (number)", function () {
          pm.expect(pm.response.json().totalPages).to.be.a("number");
      });

      pm.test("Each item in data has required fields", function () {
          const data = pm.response.json().data;
          if (data.length > 0) {
              data.forEach(function (item) {
                  pm.expect(item).to.have.property("slug");
                  pm.expect(item).to.have.property("title");
                  pm.expect(item).to.have.property("level");
                  pm.expect(item).to.have.property("schemeFor");
                  pm.expect(item).to.have.property("schemeCategory");
              });
          }
      });
