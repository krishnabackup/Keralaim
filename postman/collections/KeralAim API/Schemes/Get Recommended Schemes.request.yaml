$kind: http-request
name: Get Recommended Schemes
method: POST
url: '{{baseUrl}}/api/schemes/:id'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
pathVariables:
  - key: id
    value: test-scheme-slug
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 404", function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });
