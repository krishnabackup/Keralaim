$kind: http-request
name: Get All Schemes - No Auth Token
method: GET
url: '{{baseUrl}}/api/schemes'
order: 3000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response message includes 'No token'", function () {
          pm.expect(pm.response.json().message).to.include("No token");
      });
