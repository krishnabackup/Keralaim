$kind: http-request
name: Create Complaint - Without Image
method: POST
url: '{{baseUrl}}/complaints'
order: 2000
body:
  type: formdata
  content:
    - key: location
      type: text
      value: 'Kochi, Kerala'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success: true", function () {
          pm.expect(pm.response.json().success).to.be.true;
      });

      pm.test("data.imageUrl is empty string", function () {
          pm.expect(pm.response.json().data.imageUrl).to.equal("");
      });
