$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "testuser@example.com",
      "password": "Test@1234",
      "district": "Thiruvananthapuram"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has success: true", function () {
          pm.expect(pm.response.json().success).to.be.true;
      });

      pm.test("Response has data.token (string)", function () {
          pm.expect(pm.response.json().data).to.have.property("token");
          pm.expect(pm.response.json().data.token).to.be.a("string");
      });

      pm.test("Response has data.userId", function () {
          pm.expect(pm.response.json().data).to.have.property("userId");
      });

      // Save token to collection variable
      pm.collectionVariables.set("authToken", pm.response.json().data?.token);
